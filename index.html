<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wealth and Primary Education Gap</title>
  <link rel="stylesheet" type="text/css" href="styles.css">
</head>
<body>

<header>
  <h1>Primary Enrollment vs Completion Rate — Wealth and Education Gap</h1>
</header>

<div id="controls">
  <div class="control-group">
    <label for="year-slider">Year:</label>
    <input type="range" id="year-slider" min="1999" max="2023" step="1" value="1999">
    <span id="year-label">1999</span>
  </div>
  <div class="control-group">
    <button id="play-btn">&#9654; Play</button>
  </div>
  <div class="control-group">
    <label for="continent-filter">Continent:</label>
    <select id="continent-filter">
      <option value="all">All Continents</option>
      <option value="Africa">Africa</option>
      <option value="America">Americas</option>
      <option value="Asia/Pacific">Asia / Pacific</option>
      <option value="Europe">Europe</option>
    </select>
  </div>
</div>

<div id="maps-container">
  <div class="map-panel" id="panel-enrollment">
    <h2>Enrollment Rate (%)</h2>
    <svg id="svg-enrollment" viewBox="0 0 800 420"></svg>
  </div>
  <div class="map-panel" id="panel-completion">
    <h2>Completion Rate (%)</h2>
    <svg id="svg-completion" viewBox="0 0 800 420"></svg>
  </div>
</div>

<div id="legend">
  <div style="display:flex;align-items:center;gap:8px">
    <span class="legend-title">Rate (%):</span>
    <div class="legend-buckets" id="legend-buckets"></div>
  </div>
  <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:#888">
    <svg width="16" height="16"><rect x="1" y="1" width="14" height="14"
      fill="#BDBDBD" stroke="#aaa" stroke-width="0.5"
      stroke-dasharray="3,2"/></svg>
    No data
  </div>
</div>

<div id="stats">
  <span>Countries shown: <b id="stat-countries">—</b></span>
  <span>Avg enrollment: <b id="stat-enrol">—</b></span>
  <span>Avg completion: <b id="stat-comp">—</b></span>
  <span>Avg gap: <b id="stat-gap">—</b></span>
</div>

<div id="tooltip"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script src="main.js"></script>
</body>
</html>
